[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai-trainer-vn"
version = "0.1.0"
description = "Offline, stdlib-only pipeline toolkit for training voice AI: data prep, features, training loops, and WER/CER evaluation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["speech", "voice-ai", "training-pipeline", "vietnamese", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
voicetrain = "voicetrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
